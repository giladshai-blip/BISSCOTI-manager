<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GILAD WMS – לוח בקרה מלאי</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Assistant', sans-serif !important; }
    body { margin: 0; padding: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes pulse-anim { 0%,100%{opacity:1}50%{opacity:.5} }
    .animate-pulse { animation: pulse-anim 2s cubic-bezier(.4,0,.6,1) infinite; }
    .animate-in.fade-in { animation: fadeIn 0.5s ease both; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .scale-in { animation: scaleIn 0.2s ease both; }
    @keyframes scaleIn { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
    .urgency-pulse { animation: urgencyPulse 2s ease-in-out infinite; }
    @keyframes urgencyPulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)} 50%{box-shadow:0 0 0 12px rgba(239,68,68,0)} }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useMemo } = React;

    /* ── Icons ── */
    const Svg = ({ size=24, className='', children, ...p }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
           fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
           className={className} {...p}>{children}</svg>
    );
    const AlertTriangle   = p => <Svg {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></Svg>;
    const Truck           = p => <Svg {...p}><path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3"/><polygon points="9 17 20 17 20 12 17 7 9 7 9 17"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></Svg>;
    const EyeOff          = p => <Svg {...p}><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></Svg>;
    const Search          = p => <Svg {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Svg>;
    const RefreshCcw      = p => <Svg {...p}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></Svg>;
    const Package         = p => <Svg {...p}><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/></Svg>;
    const Factory         = p => <Svg {...p}><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/></Svg>;
    const Activity        = p => <Svg {...p}><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></Svg>;
    const LayoutDashboard = p => <Svg {...p}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Svg>;
    const Sparkles        = p => <Svg {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></Svg>;
    const Loader2         = p => <Svg {...p}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></Svg>;
    const X               = p => <Svg {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Svg>;
    const Zap             = ({ size=24, className='', ...p }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
           className={className} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
      </svg>
    );
    const Target          = p => <Svg {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Svg>;
    const ListTodo        = p => <Svg {...p}><rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></Svg>;
    const Calculator      = p => <Svg {...p}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></Svg>;
    const TrendingUp      = p => <Svg {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Svg>;
    const Clock           = p => <Svg {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Svg>;
    const CheckCircle     = p => <Svg {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></Svg>;
    const ArrowDown       = p => <Svg {...p}><line x1="12" x2="12" y1="5" y2="19"/><polyline points="19 12 12 19 5 12"/></Svg>;

    /* ── Data ── */
    const PRODUCTION_DATES = [
      { id: '2026-05-14', label: 'חמישי 14.5', target: 'לשישי 15.5' },
      { id: '2026-05-15', label: 'שישי 15.5',  target: 'לראשון 17.5' },
      { id: '2026-05-17', label: 'ראשון 17.5', target: 'לשני 18.5' },
      { id: '2026-05-18', label: 'שני 18.5',   target: 'לשלישי 19.5' },
      { id: '2026-05-19', label: 'שלישי 19.5', target: 'לרביעי 20.5' }
    ];

    const INITIAL_DATA = [
      { sku: "37575",  name: "לזניה קלאסית בינונית",            stock: 74,   orders: 216, category: "לזניות" },
      { sku: "12933",  name: "ספנקופיטה אישי",                     stock: 5,    orders: 70,  category: "מאפים" },
      { sku: "12934",  name: "ספנקופיטה",                          stock: 58,   orders: 112, category: "מאפים" },
      { sku: "36028",  name: "קיש פטריות בינוני טבעוני ללא קמח",  stock: 7,    orders: 38,  category: "קישים" },
      { sku: "37551",  name: "לזניה חצילים פארמה בינוני",          stock: 92,   orders: 108, category: "לזניות" },
      { sku: "37125",  name: "פשטידה עגולה פטריות ללא קמח בינונית", stock: 55,   orders: 72,  category: "פשטידות" },
      { sku: "36300",  name: "קיש בצל אישי",                      stock: 640,  orders: 240, category: "קישים" },
      { sku: "36400",  name: "קיש ברוקולי אישי",                   stock: 1024, orders: 264, category: "קישים" },
      { sku: "36128",  name: "קיש בטטה בינוני טבעוני ללא קמח",   stock: 70,   orders: 38,  category: "קישים" },
      { sku: "12913",  name: "מאפה פילו יווני אירועים",            stock: 33,   orders: 7,   category: "מאפים" },
      { sku: "36201",  name: "קיש תרד ומנגולד בינוני",             stock: 143,  orders: 117, category: "קישים" },
      { sku: "36402",  name: "קיש ברוקולי גדול",                    stock: 253,  orders: 121, category: "קישים" },
      { sku: "36501",  name: "קיש שרי בינוני",                      stock: 131,  orders: 56,  category: "קישים" },
      { sku: "36702",  name: "קיש גבינות וזיתים גדול",              stock: 83,   orders: 76,  category: "קישים" },
      { sku: "36851",  name: "קיש זוקיני ומנצגו בינוני",            stock: 320,  orders: 40,  category: "קישים" },
      { sku: "368511", name: "קיש זוקיני ומנצגו בינוני (מכסה)",    stock: 346,  orders: 20,  category: "קישים" },
      { sku: "375701", name: "לזניה קלאסית (8)",                   stock: 18,   orders: 10,  category: "לזניות" },
      { sku: "37521",  name: "לזניה תרד בינונית",                   stock: 0,    orders: 42,  category: "לזניות" },
      { sku: "37561",  name: "לזניה שמנת פטריות בינונית",          stock: 0,    orders: 35,  category: "לזניות" },
      { sku: "39070",  name: 'כדורי גבינה וזיתים (1 ק"ג)',             stock: 0,    orders: 54,  category: "מגשים" },
      { sku: "37553",  name: "לזניה חצילים פארמה בינוני (מכסה)",     stock: 0,    orders: 12,  category: "לזניות" },
      { sku: "37577",  name: "לזניה קלאסית בינונית (מכסה)",        stock: 0,    orders: 12,  category: "לזניות" },
      { sku: "34608",  name: 'קיש ברוקולי "בלינה"',                  stock: 0,    orders: 0,   category: "קישים" }
    ];

    const REPORTED_SHIPMENTS = {
      "37575": 146, "12933": 225, "12934": 100, "36028": 60, "37551": 30,
      "37125": 60,  "12913": 55,  "36128": 43,  "36300": 640
    };

    const INITIAL_PRODUCTION_PLAN = {
      "2026-05-14": {
        "36201": 60, "36402": 30, "36501": 60, "36702": 60, "36851": 60, "368511": 30, "375701": 60,
        "37551": 24, "37575": 24, "12934": 24, "12933": 24, "37521": 10, "37561": 12
      },
      "2026-05-15": { "37575": 100, "37551": 50, "12933": 65, "12934": 55, "36028": 35 },
      "2026-05-17": {},
      "2026-05-18": {},
      "2026-05-19": { "37575": 60, "37551": 40 }
    };

    const INITIAL_IGNORED = ["39070", "37553", "37577", "34608"];

    /* ── Urgency helpers ── */
    function getUrgency(realBalance, forecastBalance) {
      if (realBalance <= -50)                         return { level: 3, label: 'קריטי', when: 'היום!',    bg: 'bg-red-600',    text: 'text-red-600',    badge: 'bg-red-100 text-red-700',    border: 'border-red-200',    ring: 'ring-red-500' };
      if (realBalance < 0)                            return { level: 2, label: 'דחוף',   when: 'מחר',    bg: 'bg-orange-500', text: 'text-orange-500', badge: 'bg-orange-100 text-orange-700', border: 'border-orange-200', ring: 'ring-orange-400' };
      if (forecastBalance < 0)                        return { level: 1, label: 'תשומת לב',  when: 'השבוע', bg: 'bg-amber-400',  text: 'text-amber-600',  badge: 'bg-amber-100 text-amber-700',   border: 'border-amber-200',  ring: 'ring-amber-400' };
      return null;
    }

    /* ── App ── */
    function App() {
      const [items]        = useState(INITIAL_DATA);
      const [activeTab, setActiveTab]           = useState('dashboard');
      const [searchTerm, setSearchTerm]         = useState('');
      const [manualShipments, setManualShipments] = useState(REPORTED_SHIPMENTS);
      const [productionPlan, setProductionPlan] = useState(INITIAL_PRODUCTION_PLAN);
      const [ignoredSkus, setIgnoredSkus]       = useState(INITIAL_IGNORED);

      const [aiInsights, setAiInsights]   = useState(null);
      const [isAiLoading, setIsAiLoading] = useState(false);
      const [isAiModalOpen, setIsAiModalOpen] = useState(false);
      const [aiError, setAiError]         = useState(null);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [activeItem, setActiveItem]   = useState(null);
      const [activeDate, setActiveDate]   = useState(null);
      const [modalType, setModalType]     = useState('shipment');
      const [modalValue, setModalValue]   = useState('');

      const toggleIgnore = (sku) =>
        setIgnoredSkus(prev => prev.includes(sku) ? prev.filter(s => s !== sku) : [...prev, sku]);

      /* Processed data with all computed fields */
      const processedData = useMemo(() => {
        return items.map(item => {
          const manual       = manualShipments[item.sku] || 0;
          const totalPlanned = Object.values(productionPlan).reduce(
            (acc, dp) => acc + (dp[item.sku] || 0), 0);
          const realBalance     = item.stock - item.orders;
          const forecastBalance = item.stock + manual + totalPlanned - item.orders;
          const dailyProduction = PRODUCTION_DATES.reduce((acc, d) => {
            acc[d.id] = productionPlan[d.id]?.[item.sku] || 0;
            return acc;
          }, {});
          return { ...item, manual, totalPlanned, realBalance, forecastBalance, dailyProduction };
        }).filter(item => !ignoredSkus.includes(item.sku));
      }, [items, manualShipments, productionPlan, ignoredSkus]);

      /* ── SHORTAGE CALCULATION ──
         For each SKU:
           productionNeeded = how many units are still missing after current plan
           urgency          = based on realBalance and forecastBalance
      */
      const shortageData = useMemo(() => {
        return processedData
          .map(item => {
            const urgency = getUrgency(item.realBalance, item.forecastBalance);
            if (!urgency) return null;

            /* Gap still open after all planned production */
            const productionNeeded = item.forecastBalance < 0 ? Math.abs(item.forecastBalance) : 0;
            /* Gap TODAY (before any more production runs) */
            const todayGap = item.realBalance < 0 ? Math.abs(item.realBalance) : 0;
            /* Coverage: what % of orders are already covered */
            const covered = Math.min(100, Math.round(
              ((item.stock + item.manual + item.totalPlanned) / Math.max(item.orders, 1)) * 100
            ));

            return { ...item, urgency, productionNeeded, todayGap, covered };
          })
          .filter(Boolean)
          .sort((a, b) => b.urgency.level - a.urgency.level || a.forecastBalance - b.forecastBalance);
      }, [processedData]);

      const shortageStats = useMemo(() => ({
        criticalCount:   shortageData.filter(i => i.urgency.level === 3).length,
        urgentCount:     shortageData.filter(i => i.urgency.level === 2).length,
        totalNeeded:     shortageData.reduce((acc, i) => acc + i.productionNeeded, 0),
        todayGapTotal:   shortageData.reduce((acc, i) => acc + i.todayGap, 0),
        skuCount:        shortageData.length,
      }), [shortageData]);

      /* ── Dashboard / table helpers ── */
      const filteredData = processedData.filter(item => {
        const match = item.name.includes(searchTerm) || item.sku.includes(searchTerm);
        if (activeTab === 'shortages') return match && item.realBalance < 0;
        return match;
      });

      const stats = {
        realShortageCount:    processedData.filter(i => i.realBalance < 0).length,
        realTotalMissingUnits:processedData.reduce((a,i) => a + (i.realBalance < 0 ? Math.abs(i.realBalance) : 0), 0),
        totalPlannedUnits:    Object.values(productionPlan).reduce((a, d) => a + Object.values(d).reduce((b,v)=>b+v,0), 0),
        totalShippedToday:    Object.values(manualShipments).reduce((a,v)=>a+v,0)
      };

      const callGemini = async (prompt) => {
        const apiKey = "";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const res  = await fetch(url, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: { parts: [{ text: "אתה מנהל תפעול מזון. נתח דחיפויות ייצור לגלעד בעברית תקנית." }] }
          })
        });
        const data = await res.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text;
      };

      const getAiInsights = async () => {
        setIsAiLoading(true); setAiError(null); setIsAiModalOpen(true);
        const summary = processedData.map(i => ({ name: i.name, sku: i.sku, gap: i.realBalance, forecast: i.forecastBalance }));
        try {
          const text = await callGemini(`נתח את המצב לאחר תוספת הייצור של היום. מהם הדגשים למחר בבוקר? נתונים: ${JSON.stringify(summary)}`);
          setAiInsights(text);
        } catch { setAiError("תקלה בחיבור ל-AI."); }
        finally { setIsAiLoading(false); }
      };

      const handleUpdateValue = () => {
        if (!activeItem) return;
        const val = parseInt(modalValue || 0);
        if (modalType === 'shipment') {
          setManualShipments(prev => ({ ...prev, [activeItem.sku]: (prev[activeItem.sku] || 0) + val }));
        } else if (modalType === 'production' && activeDate) {
          setProductionPlan(prev => ({ ...prev, [activeDate]: { ...(prev[activeDate] || {}), [activeItem.sku]: val } }));
        }
        setIsModalOpen(false); setModalValue('');
      };

      /* ── NAV ── */
      const NAV = [
        { id: 'dashboard',    label: 'מרכז בקרה',      Icon: LayoutDashboard, color: 'blue' },
        { id: 'shortageCalc', label: 'חישוב חוסרים',    Icon: Calculator,     color: 'red'  },
        { id: 'production',   label: 'תוכנית ייצור',    Icon: Factory,        color: 'blue' },
        { id: 'shortages',    label: 'חוסרים נטו',      Icon: Activity,       color: 'red'  },
      ];

      const tabTitle = { dashboard: 'מרכז בקרה', shortageCalc: 'חישוב חוסרים שבועי', production: 'תוכנית ייצור שבועי', shortages: 'חוסרים ב-WMS' };

      return (
        <div className="min-h-screen bg-slate-50 flex text-slate-900" dir="rtl">

          {/* ── Sidebar ── */}
          <aside className="w-72 bg-slate-900 text-slate-300 flex flex-col sticky top-0 h-screen shadow-2xl z-30 border-l border-white/5">
            <div className="p-8">
              {/* Logo */}
              <div className="flex items-center gap-4 text-white mb-12">
                <div className="bg-blue-600 p-3 rounded-2xl shadow-xl">
                  <Zap size={28} className="fill-current text-white" />
                </div>
                <div>
                  <span className="text-2xl font-black tracking-tighter block leading-none">GILAD WMS</span>
                  <span className="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Management Suite</span>
                </div>
              </div>

              {/* Nav */}
              <nav className="space-y-3">
                <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 px-4">תפריט ראשי</div>
                {NAV.map(({ id, label, Icon, color }) => (
                  <button key={id} onClick={() => setActiveTab(id)}
                    className={`w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all ${
                      activeTab === id
                        ? (color === 'red' ? 'bg-red-600 text-white shadow-lg' : 'bg-blue-600 text-white shadow-lg')
                        : 'hover:bg-slate-800'
                    }`}>
                    <Icon size={22} />
                    <span className="font-bold">{label}</span>
                    {id === 'shortageCalc' && shortageStats.criticalCount > 0 && (
                      <span className="mr-auto bg-red-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full">
                        {shortageStats.criticalCount}
                      </span>
                    )}
                  </button>
                ))}

                <div className="pt-8 space-y-3">
                  <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 px-4">תכונות AI</div>
                  <button onClick={getAiInsights}
                    className="w-full flex items-center gap-4 px-5 py-5 rounded-3xl bg-gradient-to-l from-indigo-600 to-purple-600 text-white shadow-xl hover:scale-[1.03] transition-all">
                    <Sparkles size={22} className="animate-pulse" />
                    <span className="font-black">✨ ניתוח דחיפויות</span>
                  </button>
                </div>
              </nav>
            </div>

                    <p className="text-slate-400 font-bold text-xl leading-tight">{activeItem?.name}</p>
                  </div>
                </div>
                <div className="mb-16">
                  <label className="block text-[11px] font-black text-slate-500 mb-6 pr-4 uppercase tracking-[0.2em] italic">
                    כמות {modalType === 'production'
                      ? `ליום ${PRODUCTION_DATES.find(d => d.id === activeDate)?.label}`
                      : 'שיצאה מהמפעל'}:
                  </label>
                  <input type="number" autoFocus
                    className="w-full p-10 bg-slate-50 border-none rounded-[3rem] text-6xl font-black text-center focus:ring-8 focus:ring-blue-500/10 focus:bg-white outline-none transition-all shadow-inner"
                    value={modalValue} placeholder="0"
                    onChange={e => setModalValue(e.target.value)}
                    onKeyPress={e => e.key === 'Enter' && handleUpdateValue()}
                  />
                </div>
                <div className="flex gap-6">
                  <button onClick={handleUpdateValue} className="flex-1 bg-slate-900 text-white py-8 rounded-[2.5rem] font-black text-2xl hover:bg-black transition-all shadow-2xl">עדכן</button>
                  <button onClick={() => setIsModalOpen(false)} className="px-12 bg-slate-100 text-slate-500 py-8 rounded-[2.5rem] font-black text-xl hover:bg-slate-200 transition-all">ביטול</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ── Shared inventory table ── */
    function MainTable({ filteredData, activeTab, setActiveItem, setActiveDate, setModalType, setModalValue, setIsModalOpen, toggleIgnore }) {
      return (
        <div className="bg-white rounded-[3.5rem] shadow-2xl border border-slate-100 overflow-hidden mb-20">
          <div className="overflow-x-auto">
            <table className="w-full text-right border-collapse table-auto">
              <thead>
                <tr className="bg-slate-50 text-slate-400 text-[11px] font-black uppercase tracking-widest border-b border-slate-100">
                  <th className="px-10 py-8 sticky right-0 bg-slate-50 z-10">מק"ט</th>
                  <th className="px-10 py-8 sticky right-28 bg-slate-50 z-10 min-w-[300px]">תיאור מוצר</th>
                  <th className="px-6 py-8 text-center">מלאי WMS</th>
                  <th className="px-6 py-8 text-center text-emerald-600 bg-emerald-50/20">נשלח היום</th>
                  <th className="px-6 py-8 text-center text-red-500 font-black">חוסר נטו</th>
                  {activeTab === 'production' && PRODUCTION_DATES.map(date => (
                    <th key={date.id} className="px-2 py-8 text-center text-blue-600 bg-blue-50/30 border-x border-white font-black">
                      <div className="text-[12px] mb-1">{date.label}</div>
                      <div className="text-[9px] text-blue-400 opacity-60">עבור {date.target.split(' ')[1]}</div>
                    </th>
                  ))}
                  <th className="px-10 py-8 text-center font-black bg-slate-900 text-white text-[10px] uppercase">יתרה צפויה בסופ"ש</th>
                  <th className="px-10 py-8 text-center">ניהול</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 text-sm font-bold text-slate-700">
                {filteredData.map(item => (
                  <tr key={item.sku} className="hover:bg-slate-50 transition-all group">
                    <td className="px-10 py-7 text-slate-400 font-mono text-xs sticky right-0 bg-white group-hover:bg-slate-50 z-10">{item.sku}</td>
                    <td className="px-10 py-7 text-slate-900 sticky right-28 bg-white group-hover:bg-slate-50 z-10 text-lg max-w-xs truncate">{item.name}</td>
                    <td className="px-6 py-7 text-center text-slate-500 font-medium">{item.stock}</td>
                    <td className={`px-6 py-7 text-center font-black text-lg ${item.manual > 0 ? 'text-emerald-600' : 'text-slate-200'}`}>
                      {item.manual > 0 ? `+${item.manual}` : '0'}
                    </td>
                    <td className={`px-6 py-7 text-center font-black text-xl ${item.realBalance < 0 ? 'text-red-600 bg-red-50/40' : 'text-slate-200'}`}>
                      {item.realBalance < 0 ? item.realBalance : '0'}
                    </td>
                    {activeTab === 'production' && PRODUCTION_DATES.map(date => (
                      <td key={date.id}
                        className={`px-2 py-7 text-center border-x border-slate-50/50 cursor-pointer transition-all ${
                          item.dailyProduction[date.id] > 0 ? 'bg-blue-50/60' : 'hover:bg-blue-50/30'
                        }`}
                        onClick={() => { setActiveItem(item); setActiveDate(date.id); setModalType('production'); setModalValue(item.dailyProduction[date.id] || ''); setIsModalOpen(true); }}>
                        {item.dailyProduction[date.id] > 0
                          ? <span className="font-black text-blue-700 text-xl">{item.dailyProduction[date.id]}</span>
                          : <span className="text-slate-200 text-lg">0</span>}
                      </td>
                    ))}
                    <td className="px-10 py-7 text-center bg-slate-900">
                      <span className={`px-6 py-2 rounded-2xl text-sm font-black inline-block min-w-[100px] shadow-lg ${
                        item.forecastBalance < 0 ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'
                      }`}>
                        {item.forecastBalance > 0 ? `+${item.forecastBalance}` : item.forecastBalance}
                      </span>
                    </td>
                    <td className="px-10 py-7">
                      <div className="flex justify-center gap-4 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onClick={() => { setActiveItem(item); setModalType('shipment'); setIsModalOpen(true); }}
                          className="p-3 text-emerald-600 bg-emerald-50 rounded-2xl hover:bg-emerald-600 hover:text-white transition-all shadow-sm">
                          <Truck size={24}/>
                        </button>
                        <button onClick={() => toggleIgnore(item.sku)}
                          className="p-3 text-slate-300 bg-slate-50 rounded-2xl hover:bg-slate-200 hover:text-slate-600 transition-all shadow-sm">
                          <EyeOff size={24}/>
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

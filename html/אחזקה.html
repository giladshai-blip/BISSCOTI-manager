                                <StatusBadge status={ticket.status} />
                                <PriorityBadge priority={ticket.priority} />
                                {ticket.openedByName && <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', background: 'white', padding: '4px 12px', borderRadius: 20, border: '1px solid #e2e8f0' }}><Icon name="user" style={{ marginLeft: 4 }} />נפתח ע"י {ticket.openedByName}</span>}
                                {ticket.assignedTo && ticket.status !== 'פתוחה' && <span style={{ fontSize: 12, fontWeight: 700, color: 'var(--blue-dark)', background: 'var(--blue-light)', padding: '4px 12px', borderRadius: 20, border: '1px solid rgba(59, 130, 246, 0.2)' }}><Icon name="hard-hat" style={{ marginLeft: 4 }} />{ticket.status === 'טופלה' ? 'טופל ע"י' : 'בטיפול ע"י'} {ticket.assignedTo}</span>}
                            </div>
                            <p style={{ color: 'var(--text-strong)', fontSize: 16, lineHeight: 1.6, fontWeight: 500 }}>{ticket.description}</p>
                            <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 12 }}><Icon name="clock" /> תאריך פתיחה: {ticket.date}</div>
                        </div>

                        {ticket.resolution && (
                            <div>
                                <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 12, color: 'var(--green-dark)' }}><Icon name="check-circle" style={{ marginLeft: 8 }} />פירוט טיפול וסגירה</div>
                                <div style={{ background: 'var(--green-light)', borderRadius: '16px', padding: '16px', border: '1px solid rgba(34, 197, 94, 0.2)' }}>
                                    <div style={{ fontSize: 13, fontWeight: 800, color: 'var(--green-dark)', marginBottom: 6 }}>טופל ע"י {ticket.assignedTo || 'צוות אחזקה'}:</div>
                                    <div style={{ color: 'var(--text-strong)', fontSize: 15, lineHeight: 1.5, fontWeight: 500 }}>{ticket.resolution}</div>
                                </div>
                            </div>
                        )}
                        
                        {!readOnly && (
                            <div>
                                <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 12, color: 'var(--text-strong)' }}><Icon name="tags" style={{ color: 'var(--purple-main)', marginLeft: 8 }} />תיוג וסיווג מהיר</div>
                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10 }}>
                                    {AVAILABLE_TAGS.map(tag => { 
                                        const active=ticket.tags?.includes(tag); 
                                        return <button key={tag} className="tag-btn" onClick={()=>onToggleTag(ticket.id,tag)} style={{ 
                                            borderColor: active?'var(--purple-main)':'#cbd5e1', 
                                            background: active?'var(--purple-main)':'transparent', 
                                            color: active?'white':'var(--text-muted)' 
                                        }}>{tag}</button>; 
                                    })}
                                </div>
                            </div>
                        )}
                        
                        {(ticket.managerNotes?.length>0 || !readOnly) && (
                            <div>
                                <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 12, color: 'var(--text-strong)' }}><Icon name="comment-dots" style={{ color: 'var(--blue-main)', marginLeft: 8 }} />הערות פנימיות והנחיות צוות</div>
                                {ticket.managerNotes?.length>0 && <div style={{ background: 'var(--blue-light)', borderRadius: 16, padding: 16, marginBottom: 16, maxHeight: 220, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 12, border: '1px solid rgba(59, 130, 246, 0.1)' }}>
                                    {ticket.managerNotes.map(note=><div key={note.id} style={{ background: 'white', borderRadius: 12, padding: 14, boxShadow: '0 2px 4px rgba(0,0,0,0.02)' }}><div style={{ fontSize: 12, fontWeight: 800, color: 'var(--blue-main)', marginBottom: 6 }}>{note.date}{note.by&&` — ${note.by}`}</div><div style={{ fontSize: 15, color: 'var(--text-strong)', lineHeight: 1.4 }}>{note.text}</div></div>)}
                                </div>}
                                {!readOnly && (
                                    <>
                                        <textarea className="input" value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="הוסף הערה או הנחיה לאיש האחזקה..." style={{ height: 90, resize: 'none', marginBottom: 12, borderRadius: 16 }}></textarea>
                                        <button className="btn" onClick={()=>{ if(noteText.trim()){onAddNote(ticket.id,noteText);setNoteText('');} }} disabled={!noteText.trim()} style={{ width: '100%', padding: '16px', background: noteText.trim()?'var(--blue-main)':'#cbd5e1', color: 'white', fontSize: 16, cursor: noteText.trim()?'pointer':'not-allowed' }}><Icon name="paper-plane" /> פרסם הערה</button>
                                    </>
                                )}
                            </div>
                        )}
                        
                        {ticket.image && <div>
                            <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 12, color: 'var(--text-strong)' }}><Icon name="camera" style={{ color: 'var(--orange-main)', marginLeft: 8 }} />תמונה מהשטח</div>
                            <img src={ticket.image} style={{ width: '100%', maxHeight: 300, objectFit: 'contain', borderRadius: 16, border: '2px solid #f1f5f9', background: '#f8fafc' }} alt="" />
                        </div>}
                    </div>
                </div>
            </div>
        );
    }

    // ===== USERS MANAGER =====
    function UsersManager({ apiUrl }) {
        const [users, setUsers] = useState([]);
        const [loading, setLoading] = useState(true);
        const [showAdd, setShowAdd] = useState(false);
        const [newUser, setNewUser] = useState({ username: '', password: '', name: '', role: 'requester' });
        const [saving, setSaving] = useState(false);
        const [msg, setMsg] = useState('');

        const loadUsers = async () => { setLoading(true); try { const res = await fetch(`${apiUrl}?action=getUsers`); const data = await res.json(); setUsers(data.users||[]); } catch { setMsg('שגיאה בטעינת משתמשים'); } setLoading(false); };
        useEffect(() => { loadUsers(); }, []);

        const handleAdd = async () => {
            if (!newUser.username||!newUser.password||!newUser.name) { setMsg('יש למלא את כל השדות'); return; }
            setSaving(true);
            try { await fetch(apiUrl, { method: 'POST', body: JSON.stringify({ action: 'addUser', user: newUser }), headers: { "Content-Type": "text/plain;charset=utf-8" }, mode: 'no-cors' }); setMsg('המשתמש נוסף בהצלחה'); setNewUser({ username: '', password: '', name: '', role: 'requester' }); setShowAdd(false); setTimeout(() => loadUsers(), 1500); }
            catch { setMsg('שגיאה בהוספת משתמש'); }
            setSaving(false);
        };

        const handleDelete = async (username) => { if (!confirm(`האם אתה בטוח שברצונך למחוק את המשתמש ${username}?`)) return; try { await fetch(apiUrl, { method: 'POST', body: JSON.stringify({ action: 'deleteUser', username }), headers: { "Content-Type": "text/plain;charset=utf-8" }, mode: 'no-cors' }); setMsg('המשתמש נמחק'); setTimeout(() => loadUsers(), 1500); } catch { setMsg('שגיאה במחיקה'); } };

        return (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 20, maxWidth: 800, margin: '0 auto' }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', paddingBottom: 16, borderBottom: '2px solid rgba(0,0,0,0.03)' }}>
                    <h2 style={{ fontWeight: 900, fontSize: 24, letterSpacing: '-0.5px' }}>ניהול הרשאות משתמשים</h2>
                    <button className="btn btn-blue" style={{ padding: '12px 20px', fontSize: 15 }} onClick={() => setShowAdd(true)}><Icon name="user-plus" /> הוספת משתמש חדש</button>
                </div>
                
                {msg && <div style={{ background: 'var(--green-light)', border: '1px solid rgba(34, 197, 94, 0.3)', borderRadius: 12, padding: '14px 20px', color: 'var(--green-dark)', fontSize: 15, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 10 }}><Icon name="check-circle" /> {msg}</div>}
                
                {loading ? <div style={{ textAlign: 'center', padding: 60 }}><Icon name="spinner" className="spinner" style={{ fontSize: 36, color: 'var(--blue-main)' }} /></div> : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                        {users.map(user => {
                            const r = ROLE_COLORS[user.role] || ROLE_COLORS.requester;
                            return (
                                <div key={user.username} style={{ background: 'var(--surface)', borderRadius: 18, border: '1px solid #e2e8f0', padding: '16px 20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', boxShadow: 'var(--shadow-sm)' }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                                        <div style={{ width: 50, height: 50, borderRadius: '14px', background: `linear-gradient(135deg, ${r.color}, ${r.color}dd)`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, fontWeight: 800, color: 'white', flexShrink: 0, boxShadow: `0 4px 12px ${r.color}30` }}>{user.name?.charAt(0)||'?'}</div>
                                        <div>
                                            <div style={{ fontWeight: 800, fontSize: 18, color: 'var(--text-strong)' }}>{user.name}</div>
                                            <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--text-muted)', marginTop: 2 }}>@{user.username}</div>
                                            <span style={{ fontSize: 12, fontWeight: 700, color: r.color, background: r.bg, padding: '4px 12px', borderRadius: 20, marginTop: 8, display: 'inline-block', border: `1px solid ${r.color}20` }}>{r.label}</span>
                                        </div>
                                    </div>
                                    <button onClick={() => handleDelete(user.username)} style={{ border: 'none', background: 'var(--red-light)', color: 'var(--red-main)', borderRadius: 12, width: 44, height: 44, cursor: 'pointer', fontSize: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.2s' }} onMouseEnter={e => e.currentTarget.style.background = '#fecaca'} onMouseLeave={e => e.currentTarget.style.background = 'var(--red-light)'} title="מחק משתמש"><Icon name="trash-alt" /></button>
                                </div>
                            );
                        })}
                        {users.length===0 && <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)', fontSize: 16, fontWeight: 500, border: '2px dashed #e2e8f0', borderRadius: 20 }}>אין משתמשים להצגה.</div>}
                    </div>
                )}
                
                {showAdd && (
                    <div className="modal-bg" onClick={e=>{ if(e.target===e.currentTarget) setShowAdd(false); }}>
                        <div className="modal-sheet">
                            <div className="modal-handle"></div>
                            <div style={{ padding: '24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid var(--border)' }}>
                                <h2 style={{ fontWeight: 900, fontSize: 22 }}>הגדרת משתמש חדש</h2>
                                <button onClick={()=>setShowAdd(false)} style={{ width: 40, height: 40, borderRadius: '50%', border: 'none', background: '#f1f5f9', cursor: 'pointer', color: 'var(--text-strong)', fontSize: 18, transition: 'background 0.2s' }} onMouseEnter={e => e.currentTarget.style.background = '#e2e8f0'} onMouseLeave={e => e.currentTarget.style.background = '#f1f5f9'}><Icon name="times" /></button>
                            </div>
                            <div style={{ padding: '24px', display: 'flex', flexDirection: 'column', gap: 18 }}>
                                <div><label style={{ display: 'block', fontSize: 14, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 8 }}>שם מלא (תצוגה)</label><input className="input" value={newUser.name} onChange={e=>setNewUser({...newUser,name:e.target.value})} placeholder="לדוגמה: ישראל ישראלי" /></div>
                                <div><label style={{ display: 'block', fontSize: 14, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 8 }}>שם משתמש (לכניסה)</label><input className="input" value={newUser.username} onChange={e=>setNewUser({...newUser,username:e.target.value})} placeholder="לדוגמה: israel1" autoComplete="off" dir="ltr" style={{ textAlign: 'left' }} /></div>
                                <div><label style={{ display: 'block', fontSize: 14, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 8 }}>סיסמה ראשונית</label><input className="input" type="password" value={newUser.password} onChange={e=>setNewUser({...newUser,password:e.target.value})} placeholder="הקש סיסמה..." autoComplete="new-password" dir="ltr" style={{ textAlign: 'left' }} /></div>
                                <div>
                                    <label style={{ display: 'block', fontSize: 14, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 8 }}>הגדרת הרשאות / תפקיד</label>
                                    <div style={{ display: 'flex', gap: 10 }}>
                                        {Object.entries(ROLE_COLORS).map(([v, r]) => (
                                            <button key={v} className="priority-btn" onClick={()=>setNewUser({...newUser,role:v})} style={{ 
                                                borderColor: newUser.role===v?r.color:'#e2e8f0', 
                                                background: newUser.role===v?r.bg:'white', 
                                                color: newUser.role===v?r.color:'var(--text-muted)', 
                                                fontSize: 14 
                                            }}>{r.label}</button>
                                        ))}
                                    </div>
                                </div>
                                <button className="btn btn-blue" style={{ width: '100%', padding: '16px', fontSize: 18, marginTop: 12 }} onClick={handleAdd} disabled={saving}>
                                    {saving ? <><Icon name="spinner" className="spinner" /> שומר נתונים...</> : <><Icon name="user-check" /> שמור והוסף למערכת</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>Vegetable Inventory</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; /* removes 300ms tap delay */
    }

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --green: #16a34a;
      --orange: #ea580c;
      --red: #dc2626;
      --gray: #64748b;
    }

    html {
      height: 100%;
      /* prevent bounce scroll exposing background */
      background: #f1f5f9;
    }

    body {
      min-height: 100%;
      background: #f1f5f9;
      font-family: 'Inter', sans-serif;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      /* smooth iOS scroll */
      -webkit-overflow-scrolling: touch;
    }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 50;
      background: white;
      /* fill notch area with white */
      padding: calc(16px + var(--safe-top)) 20px 16px;
      border-bottom: 1px solid #e2e8f0;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 1px 10px rgba(0,0,0,0.07);
    }

    .header-left h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.3px; }
    .header-left p  { font-size: 0.72rem; color: var(--gray); margin-top: 3px; }

    .btn-header {
      display: flex; align-items: center; gap: 6px;
      /* min 44px height = Apple HIG tap target */
      min-height: 44px; padding: 0 16px;
      border-radius: 10px; border: 1.5px solid #bbf7d0;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      background: #f0fdf4; color: var(--green);
      transition: opacity 0.15s;
    }
    .btn-header:active { opacity: 0.7; }

    /* ── Stats ── */
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 14px 14px 0;
      max-width: 600px; margin: 0 auto;
    }

    .stat-card {
      background: white; border-radius: 16px; border: 1px solid #e2e8f0;
      padding: 16px 8px; text-align: center;
    }
    .stat-num   { font-size: 1.9rem; font-weight: 900; line-height: 1; }
    .stat-label { font-size: 0.7rem; font-weight: 700; color: var(--gray); margin-top: 5px; }
    .stat-sub   { font-size: 0.6rem; color: #94a3b8; margin-top: 2px; }
    .stat-card.ok       .stat-num { color: var(--green); }
    .stat-card.low      .stat-num { color: var(--orange); }
    .stat-card.critical .stat-num { color: var(--red); }

    /* ── Content ── */
    .content {
      padding: 14px 14px calc(90px + var(--safe-bottom));
      max-width: 600px; margin: 0 auto;
    }

    /* ── Item Card ── */
    .item-card {
      background: white;
      border-radius: 18px;
      border: 1.5px solid #e2e8f0;
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
      /* GPU layer for smooth animation */
      will-change: border-color;
    }
    .item-card.counted        { border-color: #86efac; background: #f0fdf4; }
    .item-card.low-stock      { border-color: #fdba74; }
    .item-card.critical-stock { border-color: #fca5a5; }

    .item-main {
      padding: 16px 16px 10px;
      display: flex; align-items: center; gap: 14px;
    }

    .item-icon {
      width: 50px; height: 50px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; flex-shrink: 0;
    }

    .item-info { flex: 1; min-width: 0; }
    .item-name   { font-size: 1rem; font-weight: 700; }
    .item-status { font-size: 0.75rem; font-weight: 600; margin-top: 4px; }
    .item-status.ok       { color: var(--green); }
    .item-status.low      { color: var(--orange); }
    .item-status.critical { color: var(--red); }

    .item-qty { text-align: right; flex-shrink: 0; }
    .item-qty-num  { font-size: 1.9rem; font-weight: 900; line-height: 1; }
    .item-qty-unit { font-size: 0.63rem; color: var(--gray); font-weight: 600; margin-top: 2px; }

    /* progress bar */
    .item-bar { margin: 2px 16px 12px; }
    .bar-track { height: 6px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
    .bar-fill.ok       { background: var(--green); }
    .bar-fill.low      { background: var(--orange); }
    .bar-fill.critical { background: var(--red); }

    /* Count button — full-width tap target, min 48px */
    .btn-count {
      width: 100%; min-height: 48px;
      padding: 13px 16px;
      background: #f8fafc; border: none; border-top: 1px solid #f1f5f9;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 0.88rem; font-weight: 600; color: #475569;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.12s;
    }
    .btn-count:active { background: #eef2f7; }
    .coin {
      width: 20px; height: 20px; border-radius: 50%;
      background: #fbbf24; color: white;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; flex-shrink: 0;
    }

    /* ── Counter Expand ── */
    .counter-expand {
      display: none;
      padding: 12px 14px 16px;
      background: #f8fafc; border-top: 1px solid #f1f5f9;
    }
    .counter-expand.open { display: block; }

    /* Row 1: big number input */
    .cnt-input {
      width: 100%; height: 64px; text-align: center;
      font-size: 2rem; font-weight: 900; color: #0f172a;
      border: 2px solid #e2e8f0; border-radius: 14px;
      background: white; font-family: 'Inter', sans-serif;
      margin-bottom: 10px;
      -moz-appearance: textfield;
    }
    .cnt-input::-webkit-outer-spin-button,
    .cnt-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .cnt-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(22,163,74,0.12); }

    /* Row 2: three equal buttons */
    .cnt-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .cnt-btn {
      height: 54px; border-radius: 14px; border: none; cursor: pointer;
      font-size: 22px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.08s, opacity 0.1s;
      user-select: none;
    }
    .cnt-btn:active { transform: scale(0.92); opacity: 0.8; }
    .cnt-minus { background: #fee2e2; color: var(--red); }
    .cnt-plus  { background: #dcfce7; color: var(--green); }

    .cnt-confirm {
      height: 54px; border-radius: 14px; border: none; cursor: pointer;
      background: var(--green); color: white; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.08s, opacity 0.1s;
    }
    .cnt-confirm:active { transform: scale(0.92); opacity: 0.85; }
    .cnt-confirm.saving { background: #94a3b8; pointer-events: none; }

    /* ── Bottom bar ── */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      padding: 12px 14px calc(10px + var(--safe-bottom));
      background: white;
      border-top: 1px solid #e2e8f0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.09);
    }

    .btn-report {
      width: 100%; max-width: 600px; margin: 0 auto;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      min-height: 56px; padding: 0 24px;
      border-radius: 16px; border: none;
      background: var(--green); color: white; cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-report:active { opacity: 0.85; transform: scale(0.98); }
    .btn-report-text  { font-size: 0.97rem; font-weight: 800; }
    .btn-report-sub   { font-size: 0.72rem; font-weight: 500; opacity: 0.8; direction: rtl; margin-top: 1px; }

    /* ── Loading ── */
    .loading { text-align: center; padding: 70px 20px; color: #94a3b8; font-weight: 600; font-size: 0.9rem; }
    .loading i { font-size: 2.2rem; display: block; margin-bottom: 14px; }

    /* ── Toast ── */
    #toast {
      position: fixed; z-index: 9999;
      bottom: calc(86px + var(--safe-bottom));
      left: 50%; transform: translateX(-50%);
      white-space: nowrap; pointer-events: none;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <h1>Vegetable Inventory</h1>
    <p>Biscotti · מלאי ירקות</p>
  </div>
  <div class="header-actions">
    <button class="btn-header sync" onclick="loadItems()" id="sync-btn">
      <i id="sync-icon" class="fas fa-rotate"></i> Sync
    </button>
  </div>
</header>

<div class="stats" id="stats">
  <div class="stat-card ok"><div class="stat-num" id="stat-ok">–</div><div class="stat-label">OK</div><div class="stat-sub">תקין</div></div>
  <div class="stat-card low"><div class="stat-num" id="stat-low">–</div><div class="stat-label">Low</div><div class="stat-sub">נמוך</div></div>
  <div class="stat-card critical"><div class="stat-num" id="stat-critical">–</div><div class="stat-label">Critical</div><div class="stat-sub">קריטי</div></div>
</div>

<div class="content">
  <div id="items-list"><div class="loading"><i class="fas fa-spinner fa-spin"></i>Loading inventory...</div></div>
</div>

<div class="bottom-bar">
  <button class="btn-report" onclick="sendWhatsApp()">
    <i class="fab fa-whatsapp" style="font-size:1.5rem; flex-shrink:0;"></i>
    <div>
      <div class="btn-report-text">Send Report to Gilad</div>
      <div class="btn-report-sub">שלח דוח · גלעד</div>
    </div>
  </button>
</div>

<div id="toast" style="display:none;"></div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxaAORg5xUnEL_TIQ4q9PKvecn71KX18mF0t3daazQYkRNvnfSKSSeDL67rY1CqMqRdqw/exec';
  const WHATSAPP_NUMBER = '972526664040';

  const VEGE_MAP = {
    'ארגז עגבניות': { en: 'Tomato Box',      emoji: '🍅', bg: '#fef2f2', unit: 'Cartons', unitHe: 'ארגזים' },
    'חצילים':       { en: 'Eggplant',         emoji: '🍆', bg: '#faf5ff', unit: 'Cartons', unitHe: 'ארגזים' },
    'זוקיני':        { en: 'Zucchini',         emoji: '🥒', bg: '#f0fdf4', unit: 'Cartons', unitHe: 'ארגזים' },
    'שרי':           { en: 'Cherry Tomatoes',  emoji: '🍅', bg: '#fef2f2', unit: 'Cartons', unitHe: 'ארגזים' },
    'בצל ירוק':     { en: 'Green Onion',       emoji: '🌱', bg: '#f0fdf4', unit: 'Cartons', unitHe: 'ארגזים' },
    'בצל סגול':     { en: 'Purple Onion',      emoji: '🧅', bg: '#fdf4ff', unit: 'Cartons', unitHe: 'ארגזים' },
    'מנגולד':        { en: 'Chard',             emoji: '🥬', bg: '#f0fdf4', unit: 'kg',      unitHe: 'ק"ג'    },
    'בזיליקום':      { en: 'Basil',             emoji: '🌿', bg: '#f0fdf4', unit: 'kg',      unitHe: 'ק"ג'    },
    'תרד':           { en: 'Spinach',           emoji: '🥬', bg: '#f0fdf4', unit: 'Cartons', unitHe: 'ארגזים' },
    'פלפל אדום':    { en: 'Red Pepper',        emoji: '🌶️', bg: '#fef2f2', unit: 'Cartons', unitHe: 'ארגזים' },
    'פלפל צהוב':    { en: 'Yellow Pepper',     emoji: '🫑', bg: '#fefce8', unit: 'Cartons', unitHe: 'ארגזים' },
    'פטרוזיליה':     { en: 'Parsley',           emoji: '🌿', bg: '#f0fdf4', unit: 'Cartons', unitHe: 'ארגזים' },
  };

  function getVegeInfo(id) {
    return VEGE_MAP[id.trim()] || { en: id, emoji: '🥬', bg: '#f0fdf4' };
  }

  function getStatus(qty, min) {
    if (qty === 0)       return 'critical';
    if (qty < min)       return 'low';
    return 'ok';
  }

  function getStatusLabel(status) {
    if (status === 'critical') return '✕ Critical';
    if (status === 'low')      return '⚠ Low Stock';
    return '✓ OK';
  }

  function getBarPct(qty, min) {
    if (!min || min === 0) return qty > 0 ? 100 : 0;
    return Math.min(100, Math.round((qty / (min * 2)) * 100));
  }

  function showToast(msg, color = '#1e293b') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.cssText = `display:block; background:${color}; color:white; padding:10px 20px; border-radius:12px; font-weight:700; font-size:0.82rem; box-shadow:0 4px 16px rgba(0,0,0,0.2);`;
    setTimeout(() => t.style.display = 'none', 2000);
  }

  async function api(action, payload = null) {
    const url = `${GAS_URL}?action=${action}&payload=${encodeURIComponent(JSON.stringify(payload))}&t=${Date.now()}`;
    const res  = await fetch(url, { redirect: 'follow' });
    const json = await res.json();
    if (json.status === 'error') throw new Error(json.message);
    return json.data;
  }

  async function loadItems() {
    const icon = document.getElementById('sync-icon');
    icon.classList.add('fa-spin');
    openCard = null;
    try {
      const data = await api('getBootstrap');
      // deduplicate by id — keep last entry (most recent row in sheet)
      const seen = new Map();
      (data.inventory || []).forEach(i => seen.set(i.id, i));
      items = [...seen.values()].map(i => ({ ...i, counted: false }));
      renderItems();
    } catch (e) {
      document.getElementById('items-list').innerHTML =
        `<div class="loading"><i class="fas fa-triangle-exclamation"></i>Failed to load<br><small style="font-weight:500">${e.message}</small></div>`;
    }
    icon.classList.remove('fa-spin');
  }

  function renderItems() {
    const list = document.getElementById('items-list');
    list.innerHTML = '';

    if (!items.length) {
      list.innerHTML = '<div class="loading"><i class="fas fa-box-open"></i>No items found</div>';
      updateStats();
      return;
    }

    items.forEach(item => {
      const info   = getVegeInfo(item.id);
      const status = getStatus(Number(item.qty), Number(item.min));
      const pct    = getBarPct(Number(item.qty), Number(item.min));

      const card = document.createElement('div');
      let cardClass = 'item-card';
      if (item.counted) cardClass += ' counted';
      else if (status === 'critical') cardClass += ' critical-stock';
      else if (status === 'low')      cardClass += ' low-stock';
      card.className = cardClass;
      card.id = `card-${item.id}`;

      card.innerHTML = `
        <div class="item-main">
          <div class="item-icon" style="background:${info.bg}">${info.emoji}</div>
          <div class="item-info">
            <div class="item-name">${info.en}</div>
            <div class="item-status ${status}" id="status-${item.id}">${getStatusLabel(status)}</div>
          </div>
          <div class="item-qty">
            <div class="item-qty-num" id="qty-${item.id}">${item.qty}</div>
            <div class="item-qty-unit">${info.unit}<br>${info.unitHe}</div>
          </div>
        </div>
        <div class="item-bar">
          <div class="bar-track"><div class="bar-fill ${status}" id="bar-${item.id}" style="width:${pct}%"></div></div>
        </div>
        <button class="btn-count" onclick="toggleCounter('${item.id}')">
          <span class="coin">●</span>
          Count Inventory · ספירת מלאי
        </button>
        <div class="counter-expand" id="expand-${item.id}">
          <input class="cnt-input" id="input-${item.id}" type="number" value="${item.qty}" min="0"
            oninput="onInput('${item.id}', this.value)">
          <div class="cnt-btns">
            <button class="cnt-btn cnt-minus" onclick="adjustQty('${item.id}', -1)">−</button>
            <button class="cnt-btn cnt-plus"  onclick="adjustQty('${item.id}',  1)">+</button>
            <button class="cnt-confirm" id="confirm-${item.id}" onclick="confirmCount('${item.id}')">
              <i class="fas fa-check"></i>
            </button>
          </div>
        </div>`;
      list.appendChild(card);
    });

    updateStats();
  }

  function toggleCounter(id) {
    const expand = document.getElementById(`expand-${id}`);
    if (expand.classList.contains('open')) {
      expand.classList.remove('open');
      openCard = null;
    } else {
      if (openCard) document.getElementById(`expand-${openCard}`)?.classList.remove('open');
      expand.classList.add('open');
      openCard = id;
      // scroll card into view so keyboard doesn't cover it
      setTimeout(() => {
        document.getElementById(`card-${id}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        document.getElementById(`input-${id}`)?.focus();
      }, 80);
    }
  }

  function onInput(id, val) {
    const item = items.find(x => x.id === id);
    if (item) item.qty = Math.max(0, Number(val) || 0);
  }

  function adjustQty(id, delta) {
    const input = document.getElementById(`input-${id}`);
    if (!input) return;
    input.value = Math.max(0, (Number(input.value) || 0) + delta);
  }

  async function confirmCount(id) {
    const item    = items.find(x => x.id === id);
    if (!item) return;
    const qty     = Math.max(0, Number(document.getElementById(`input-${id}`)?.value) || 0);
    const confirm = document.getElementById(`confirm-${id}`);

    confirm.classList.add('saving');
    confirm.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    try {
      await api('updateInventory', { id: item.id, qty, min: item.min });
      item.qty     = qty;
      item.counted = true;

      // update display
      document.getElementById(`qty-${id}`).textContent = qty;
      const status = getStatus(qty, Number(item.min));
      const pct    = getBarPct(qty, Number(item.min));
      document.getElementById(`status-${id}`).className = `item-status ${status}`;
      document.getElementById(`status-${id}`).textContent = getStatusLabel(status);
      const bar = document.getElementById(`bar-${id}`);
      bar.style.width = pct + '%';
      bar.className = `bar-fill ${status}`;

      const card = document.getElementById(`card-${id}`);
      card.className = 'item-card counted';
      document.getElementById(`expand-${id}`).classList.remove('open');
      openCard = null;

      showToast(`✓ ${item.id} saved`, '#16a34a');
      updateStats();
    } catch (e) {
      showToast('Save failed', '#ef4444');
    }

    confirm.classList.remove('saving');
    confirm.innerHTML = '<i class="fas fa-check"></i>';
  }

  function updateStats() {
    const ok       = items.filter(i => getStatus(Number(i.qty), Number(i.min)) === 'ok').length;
    const low      = items.filter(i => getStatus(Number(i.qty), Number(i.min)) === 'low').length;
    const critical = items.filter(i => getStatus(Number(i.qty), Number(i.min)) === 'critical').length;
    document.getElementById('stat-ok').textContent       = ok;
    document.getElementById('stat-low').textContent      = low;
    document.getElementById('stat-critical').textContent = critical;
  }

  function sendWhatsApp() {
    const date = new Date().toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
    const time = new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });

    let lines = [`🥬 *דוח מלאי ירקות*`, `📅 ${date} | ${time}`, ``];

    items.forEach(item => {
      const status = getStatus(Number(item.qty), Number(item.min));
      const icon   = status === 'critical' ? '🔴' : status === 'low' ? '🟡' : '🟢';
      const info   = getVegeInfo(item.id);
      const info = getVegeInfo(item.id);
      lines.push(`${icon} ${item.id}: *${item.qty}* ${info.unitHe}`);
    });

    const counted  = items.filter(i => i.counted).length;
    const critical = items.filter(i => getStatus(Number(i.qty), Number(i.min)) === 'critical').length;
    const low      = items.filter(i => getStatus(Number(i.qty), Number(i.min)) === 'low').length;

    lines.push(``);
    lines.push(`✅ נספרו: ${counted}/${items.length} פריטים`);
    if (critical > 0) lines.push(`🔴 קריטי: ${critical} פריטים`);
    if (low      > 0) lines.push(`🟡 נמוך:  ${low} פריטים`);

    const msg = lines.join('\n');
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  async function silentSync() {
    try {
      const data = await api('getBootstrap');
      const fresh = data.inventory || [];
      fresh.forEach(f => {
        const item = items.find(x => x.id === f.id);
        // only update items the worker hasn't counted yet this session
        if (item && !item.counted) {
          item.qty = f.qty;
          item.min = f.min;
          const qtyEl = document.getElementById(`qty-${item.id}`);
          // don't overwrite input if counter is open for this item
          if (openCard !== item.id) {
            const input = document.getElementById(`input-${item.id}`);
            if (input) input.value = f.qty;
          }
          if (qtyEl) qtyEl.textContent = f.qty;
          const status = getStatus(Number(f.qty), Number(f.min));
          const pct    = getBarPct(Number(f.qty), Number(f.min));
          const statusEl = document.getElementById(`status-${item.id}`);
          const barEl    = document.getElementById(`bar-${item.id}`);
          if (statusEl) { statusEl.className = `item-status ${status}`; statusEl.textContent = getStatusLabel(status); }
          if (barEl)    { barEl.style.width = pct + '%'; barEl.className = `bar-fill ${status}`; }
        }
      });
      updateStats();
    } catch (_) { /* silent — don't toast on background errors */ }
  }

  loadItems();
  setInterval(silentSync, 10000);
</script>
</body>
</html>

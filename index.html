<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biscotti Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Heebo', sans-serif;
      background: #f4f7fb;
      color: #0f172a;
      direction: rtl;
      min-height: 100vh;
    }

    header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .logo {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: white;
    }

    header h1 { font-size: 1.4rem; font-weight: 900; letter-spacing: -0.5px; }
    header span { font-size: 0.85rem; color: #64748b; }

    .status-bar {
      background: #f0fdf4;
      border-bottom: 1px solid #bbf7d0;
      padding: 10px 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #16a34a;
    }

    .dot {
      width: 8px; height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    main { padding: 40px 32px; max-width: 960px; margin: 0 auto; }

    h2 { font-size: 1rem; color: #64748b; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      border-color: transparent;
    }

    .card-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .card h3 { font-size: 1rem; font-weight: 700; }
    .card p  { font-size: 0.82rem; color: #64748b; line-height: 1.5; }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      align-self: flex-start;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
      70%  { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }

    @media (max-width: 600px) {
      main { padding: 24px 16px; }
      header { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🍪</div>
  <div>
    <h1>Biscotti Manager</h1>
    <span>מערכת ניהול מרכזית</span>
  </div>
</header>

<div class="status-bar">
  <div class="dot"></div>
  מחובר ל-Google Sheets
</div>

<main>
  <h2>מודולים</h2>
  <div class="grid">

    <a class="card" href="html/אחזקה.html">
      <div class="card-icon" style="background:#fef2f2; color:#ef4444;">
        <i class="fas fa-tools"></i>
      </div>
      <h3>אחזקה</h3>
      <p>ניהול קריאות תקלות, מעקב תיקונים והיסטוריית טיפולים.</p>
      <span class="badge" style="background:#fef2f2; color:#ef4444;">פעיל</span>
    </a>

    <!-- מודולים עתידיים -->
    <div class="card" style="opacity:0.45; cursor:default;">
      <div class="card-icon" style="background:#eff6ff; color:#3b82f6;">
        <i class="fas fa-users"></i>
      </div>
      <h3>ניהול עובדים</h3>
      <p>נוכחות, שכר ופרטי עובדים.</p>
      <span class="badge" style="background:#eff6ff; color:#3b82f6;">בקרוב</span>
    </div>

    <div class="card" style="opacity:0.45; cursor:default;">
      <div class="card-icon" style="background:#f0fdf4; color:#22c55e;">
        <i class="fas fa-boxes"></i>
      </div>
      <h3>מלאי</h3>
      <p>מעקב רמות מלאי והתראות מינימום.</p>
      <span class="badge" style="background:#f0fdf4; color:#22c55e;">בקרוב</span>
    </div>

    <div class="card" style="opacity:0.45; cursor:default;">
      <div class="card-icon" style="background:#faf5ff; color:#8b5cf6;">
        <i class="fas fa-chart-bar"></i>
      </div>
      <h3>שעות תקן</h3>
      <p>ניתוח יעילות וביצועי קווי ייצור.</p>
      <span class="badge" style="background:#faf5ff; color:#8b5cf6;">בקרוב</span>
    </div>

  </div>
</main>

</body>
</html>

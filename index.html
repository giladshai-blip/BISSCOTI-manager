<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ביסקוטי">
  <meta name="theme-color" content="#ffffff">
  <title>Biscotti Manager</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23f97316%22/><text x=%2250%22 y=%2272%22 font-size=%2265%22 text-anchor=%22middle%22>🍪</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23f97316%22/><text x=%2250%22 y=%2272%22 font-size=%2265%22 text-anchor=%22middle%22>🍪</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Heebo', sans-serif;
      background: #f4f7fb;
      color: #0f172a;
      direction: rtl;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: calc(16px + var(--safe-top)) 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 1px 12px rgba(0,0,0,0.06);
    }

    .header-brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(249,115,22,0.35);
      flex-shrink: 0;
    }

    .brand-text h1 { font-size: 1.25rem; font-weight: 900; letter-spacing: -0.5px; line-height: 1.2; }
    .brand-text span { font-size: 0.75rem; color: #64748b; font-weight: 500; }

    .status-pill {
      display: flex; align-items: center; gap: 6px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #16a34a;
      white-space: nowrap;
    }

    .dot {
      width: 7px; height: 7px;
      background: #22c55e;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }

    /* ── Main ── */
    main {
      padding: 28px 16px calc(28px + var(--safe-bottom));
      max-width: 900px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    /* ── Grid ── */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* ── Card ── */
    .card {
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      padding: 20px 16px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      -webkit-user-select: none;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .card.active:active { transform: scale(0.97); }

    .card.active:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.09);
      border-color: transparent;
    }

    .card.inactive {
      opacity: 0.5;
      cursor: default;
    }

    .card-icon {
      width: 46px; height: 46px;
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px;
    }

    .card h3 { font-size: 0.95rem; font-weight: 800; line-height: 1.3; }
    .card p  { font-size: 0.78rem; color: #64748b; line-height: 1.5; flex-grow: 1; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 20px;
      align-self: flex-start;
    }

    /* ── Desktop overrides ── */
    @media (min-width: 640px) {
      main { padding: 40px 32px; }
      .modules-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }
      .card { padding: 24px 20px; }
      header { padding: 18px 32px; }
      .brand-text h1 { font-size: 1.4rem; }
      .brand-text span { font-size: 0.85rem; }
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
      70%  { box-shadow: 0 0 0 5px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="logo">🍪</div>
    <div class="brand-text">
      <h1>Biscotti Manager</h1>
      <span>מערכת ניהול מרכזית</span>
    </div>
  </div>
  <div class="status-pill">
    <div class="dot"></div>
    <span class="hidden-xs">Google Sheets</span>
    <span class="show-xs">מחובר</span>
  </div>
</header>

<main>
  <div class="section-label">מודולים פעילים</div>
  <div class="modules-grid">

    <a class="card active" href="html/אחזקה.html">
      <div class="card-icon" style="background:#fef2f2; color:#ef4444;">
        <i class="fas fa-tools"></i>
      </div>
      <h3>אחזקה</h3>
      <p>קריאות תקלות, מעקב תיקונים והיסטוריה.</p>
      <span class="badge" style="background:#fef2f2; color:#ef4444;">
        <i class="fas fa-circle" style="font-size:5px;"></i> פעיל
      </span>
    </a>

    <a class="card active" href="html/ניהול-עובדים.html">
      <div class="card-icon" style="background:#eff6ff; color:#1a73e8;">
        <i class="fas fa-users"></i>
      </div>
      <h3>ניהול עובדים</h3>
      <p>CRM, שעות, מלאי, משימות והזמנות.</p>
      <span class="badge" style="background:#eff6ff; color:#1a73e8;">
        <i class="fas fa-circle" style="font-size:5px;"></i> פעיל
      </span>
    </a>

    <div class="card inactive">
      <div class="card-icon" style="background:#f0fdf4; color:#22c55e;">
        <i class="fas fa-boxes"></i>
      </div>
      <h3>מלאי</h3>
      <p>רמות מלאי והתראות מינימום.</p>
      <span class="badge" style="background:#f1f5f9; color:#94a3b8;">בקרוב</span>
    </div>

    <div class="card inactive">
      <div class="card-icon" style="background:#faf5ff; color:#8b5cf6;">
        <i class="fas fa-chart-bar"></i>
      </div>
      <h3>שעות תקן</h3>
      <p>ביצועי קווי ייצור ויעילות.</p>
      <span class="badge" style="background:#f1f5f9; color:#94a3b8;">בקרוב</span>
    </div>

  </div>
</main>

</body>
</html>
